<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="gqlpulse-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect x="5" y="5" width="90" height="90" rx="22" fill="#0b0f17" stroke="#1e293b" stroke-width="2" />

  <!-- GraphQL Hexagonal Base Outline -->
  <polygon points="50,18 78,34 78,66 50,82 22,66 22,34" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-dasharray="2 2" />

  <!-- Pulse Wave Path -->
  <path d="M 22,50 L 36,50 L 42,32 L 48,68 L 54,42 L 58,54 L 64,50 L 78,50" 
        fill="none" 
        stroke="url(#gqlpulse-grad)" 
        stroke-width="3.5" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#glow)" />

  <!-- Pulse Node Dots -->
  <circle cx="42" cy="32" r="3" fill="#06b6d4" />
  <circle cx="48" cy="68" r="3" fill="#e11d48" />
  <circle cx="54" cy="42" r="2.5" fill="#3b82f6" />
</svg>
